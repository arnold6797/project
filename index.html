<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dahab Loan Tracker</title>
  <!-- Supabase CDN Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 600px; background: #fff; padding: 30px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; background: #28a745; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #218838; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Dahab Loan Tracker - Application Form</h2>
    <form id="loanForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="name" required></div>
      <div class="form-group"><label>Phone Number</label><input type="text" id="phone" required></div>
      <div class="form-group"><label>Email Address</label><input type="email" id="email" required></div>
      <div class="form-group"><label>National ID</label><input type="text" id="national_id" required></div>
      <div class="form-group"><label>Date of Birth</label><input type="date" id="date_of_birth" required></div>
      <div class="form-group">
        <label>Gender</label>
        <select id="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button type="submit">Submit Application</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://dfxemwmoacgxbiXteupf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_UMVjykNPjux5g0ZzqfzmhQ_n0iIE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loanForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        national_id: document.getElementById('national_id').value,
        date_of_birth: document.getElementById('date_of_birth').value,
        gender: document.getElementById('gender').value
      };

      const { data, error } = await supabaseClient
        .from('submissions')
        .insert([formData]);

      if (error) {
        console.error('Error submitting form:', error.message);
        alert('Submission failed: ' + error.message);
      } else {
        alert('Application submitted successfully!');
        e.target.reset();
      }
    });
  </script>
</body>
</html>
